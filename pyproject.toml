[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-memory"
version = "0.1.0"
description = "Local-first agent memory with separate authoritative storage and retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[project.scripts]
fusion-memory = "fusion_memory.cli:main"
fm-eval = "fusion_memory.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fusion_memory/app.py" = ["B008"] # FastAPI declares dependency factories in defaults.
